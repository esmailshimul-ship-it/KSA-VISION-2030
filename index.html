            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

            border: 2px solid var(--saudi-gold);

        }

            padding: 8px 16px;

            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }
        .lang-btn:hover {
